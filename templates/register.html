{% extends "base.html" %}
{% block title %}Create account — {{ app_name }}{% endblock %}

{% block content %}
<div class="auth-shell">
  <div class="ds-card auth-card p-4 p-md-5">
    <div class="eyebrow mb-2">New account</div>
    <h3 class="font-mono mb-1">Create your account</h3>
    <p class="text-muted-ds mb-4" style="font-size: 0.9rem;">You'll set up two-factor authentication right after this step.</p>

    <form method="POST" novalidate>
      <div class="mb-3">
        <label class="form-label" for="username">Username</label>
        <input type="text" class="form-control" id="username" name="username" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label" for="email">Email</label>
        <input type="email" class="form-control" id="email" name="email" required>
      </div>
      <div class="mb-3">
        <label class="form-label" for="password">Password</label>
        <input type="password" class="form-control" id="password" name="password" minlength="8" required>
      </div>
      <div class="mb-4">
        <label class="form-label" for="confirm_password">Confirm password</label>
        <input type="password" class="form-control" id="confirm_password" name="confirm_password" minlength="8" required>
      </div>
      <button type="submit" class="btn btn-ds-accent w-100 py-2">Continue to MFA setup</button>
    </form>

    <div class="text-center mt-4 text-muted-ds" style="font-size: 0.9rem;">
      Already have an account? <a href="{{ url_for('login') }}">Log in</a>
    </div>
  </div>
</div>
{% endblock %}
