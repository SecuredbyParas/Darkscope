{% extends "base.html" %}
{% block title %}Log in — {{ app_name }}{% endblock %}

{% block content %}
<div class="auth-shell">
  <div class="ds-card auth-card p-4 p-md-5">
    <div class="eyebrow mb-2">Welcome back</div>
    <h3 class="font-mono mb-4">Log in</h3>

    <form method="POST" novalidate>
      <div class="mb-3">
        <label class="form-label" for="identifier">Username or email</label>
        <input type="text" class="form-control" id="identifier" name="identifier" required autofocus>
      </div>
      <div class="mb-4">
        <label class="form-label" for="password">Password</label>
        <input type="password" class="form-control" id="password" name="password" required>
      </div>
      <button type="submit" class="btn btn-ds-accent w-100 py-2">Continue</button>
    </form>

    <div class="text-center mt-4 text-muted-ds" style="font-size: 0.9rem;">
      Don't have an account? <a href="{{ url_for('register') }}">Create one</a>
    </div>
  </div>
</div>
{% endblock %}
