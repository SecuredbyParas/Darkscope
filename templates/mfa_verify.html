{% extends "base.html" %}
{% block title %}Verify code — {{ app_name }}{% endblock %}

{% block content %}
<div class="auth-shell">
  <div class="ds-card auth-card p-4 p-md-5">
    <div class="eyebrow mb-2">Two-factor check</div>
    <h3 class="font-mono mb-1">Enter your code</h3>
    <p class="text-muted-ds mb-4" style="font-size: 0.9rem;">Open your authenticator app and enter the current 6-digit code.</p>

    <form method="POST" novalidate>
      <div class="mb-4">
        <label class="form-label" for="otp_code">6-digit code</label>
        <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6"
               class="form-control text-center font-mono" id="otp_code" name="otp_code"
               style="font-size: 1.3rem; letter-spacing: 0.3em;" required autofocus>
      </div>
      <button type="submit" class="btn btn-ds-accent w-100 py-2">Verify</button>
    </form>
  </div>
</div>
{% endblock %}
